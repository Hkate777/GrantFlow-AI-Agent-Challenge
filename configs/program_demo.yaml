# 示範資助計劃：HK 創科加速計劃 2027
program_id: HK-ACC-2027
name: "香港創科加速計劃2027（示範配置）"
deadline: "2027-01-03"

# 必填表單字段
required_fields:
  - { key: org_type,    label: 申請主體類型, ftype: str }
  - { key: contact,     label: 聯繫人,       ftype: str }
  - { key: email,       label: 聯繫郵箱,     ftype: email }
  - { key: budget,      label: 申請預算(HKD), ftype: number, min_value: 10000 }
  - { key: duration_m,  label: 項目週期(月), ftype: number, min_value: 3, max_value: 36 }

# 必備/建議附件（按文件名關鍵詞匹配）
required_docs:
  - { name: proposal,    doc_type: any, required: true }   # 項目申請書
  - { name: budget,      doc_type: any, required: true }   # 預算表
  - { name: cv,          doc_type: any, required: true }   # 團隊簡歷
  - { name: endorsement, doc_type: any, required: false }  # 推薦信（建議）
  - { name: demo,        doc_type: any, required: false }  # 演示視頻（建議）

# 評審維度（對應評審框架；百分制歸一由 review.py 完成）
criteria:
  - { name: 創新性,     weight: 3, max_score: 30 }
  - { name: 可行性,     weight: 3, max_score: 30 }
  - { name: 團隊能力,   weight: 2, max_score: 20 }
  - { name: 社會價值,   weight: 2, max_score: 20 }

# 資格條件
eligibility:
  min_team: 1
  max_team: 8
  allowed_org_types: [ university, research_institute, enterprise, startup ]
  excluded_keywords: [ "gambling", "賭博", "arms", "武器" ]

# 預算上限（HKD）
budget_cap: 500000

# 評審分歧閾值：加權總分(百分制)差值超過該值 至 觸發複議
divergence_threshold: 15

# 潛在利益衝突：評審人 -> 衝突關鍵詞（出現在申請中即迴避）
conflict_rules:
  "Prof. Chan": [ "CUHK", "香港中文大學" ]
  "Dr. Lee":    [ "NetDragon", "網龍" ]

min_reviewers: 2
