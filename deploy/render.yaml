# Render Blueprint 部署範例：需具備付費方案以掛載永久性磁碟。
services:
  - type: web
    name: grantflow
    runtime: docker
    plan: starter
    region: hongkong
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: GRANTFLOW_HOST
        value: 0.0.0.0
      - key: GRANTFLOW_PORT
        value: 8000
      - key: GRANTFLOW_DB
        value: /data/grantflow.sqlite3
      - key: GRANTFLOW_ALLOWED_HOSTS
        value: grantflow.onrender.com,localhost,127.0.0.1
      - key: GRANTFLOW_TRUST_PROXY
        value: true
      - key: GRANTFLOW_HTTPS_ONLY
        value: true
      - key: GRANTFLOW_RATE_LIMIT_PER_MIN
        value: 120
      - key: GRANTFLOW_AUTH_FAIL_LIMIT
        value: 10
      - key: GRANTFLOW_BOOTSTRAP_PASSWORD
        sync: false
      - key: GRANTFLOW_VAULT_PASS
        sync: false
    disk:
      name: grantflow-data
      mountPath: /data
      sizeGB: 1
